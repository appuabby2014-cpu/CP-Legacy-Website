<!DOCTYPE html>
<html>
<head>

<title>Club Penguin Legacy Login</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(#4db8ff,#bfefff);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.loginBox{

background:white;
padding:40px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,.3);
width:350px;

}

h1{

color:#008cff;

}

input{

width:90%;
padding:12px;
margin:10px;
border-radius:10px;
border:1px solid #aaa;

}

button{

background:#008cff;
color:white;
border:none;
padding:12px 25px;
border-radius:10px;
font-size:18px;
cursor:pointer;

}

button:hover{

background:#006fd6;

}

.snow{

position:fixed;
top:-20px;
color:white;
font-size:20px;
animation:fall linear infinite;

}

@keyframes fall{

to{

transform:translateY(110vh);

}

}

</style>

</head>

<body>


<div class="loginBox">

<h1>🐧 Club Penguin Legacy</h1>

<h2>Welcome!</h2>

<input id="username" placeholder="Username">

<br>

<input id="password" type="password" placeholder="Password">

<br><br>

<button onclick="login()">
LOGIN
</button>

<h3 id="msg"></h3>

</div>




<script>

let passwords={

"Fiery_Fortnite_Crusher":"123",

"Abby":"abby001",

"Appu":"appu123",

"Ceyone":"ceyone123",

"Azad":"azad456",

"Arnav":"arnav789"

};



function login(){

let u=document.getElementById("username").value;

let p=document.getElementById("password").value;


if(passwords[u]==p){

window.location.href="Home.html?player="+u;

}

else{

document.getElementById("msg").innerHTML="❌ Invalid Username or Password";

}

}



//Snow

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="snow";

s.innerHTML="❄";

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=(5+Math.random()*8)+"s";

s.style.opacity=Math.random();

s.style.fontSize=(10+Math.random()*20)+"px";

document.body.appendChild(s);

}

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://yhccnaljtfiwdwwrdtcm.supabase.co";

const SUPABASE_KEY = "sb_publishable_PU7x7B2L7mXBmbTaFWJ-hQ_2wD3MXMU";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

console.log("Supabase connected!");

</script>

<script>

async function loadPlayers(){

const { data, error } = await supabaseClient
.from("players")
.select("*");

if(error){

console.log("Error:", error);
return;

}


let list = "";

data.forEach(player => {

list += `
<p>
🐧 ${player.username}<br>
🏅 ${player.badge || "No Badge"}<br>
🪙 ${player.coins || 0} coins
</p>
<hr>
`;

});


document.getElementById("playerList").innerHTML = list;

}

loadPlayers();

</script>

</body>

</html>
