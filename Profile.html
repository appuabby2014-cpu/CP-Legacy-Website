<!DOCTYPE html>
<html>

<head>

<title>Penguin Profile - CP Legacy</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #dff6ff;
    margin: 0;
}


header {
    background-color: #008cff;
    color: white;
    text-align: center;
    padding: 30px;
}


.profile {
    background: white;
    margin: 20px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 3px 10px gray;
}


.badges {
    background-color: gold;
    padding: 15px;
    border-radius: 10px;
}


button {
    background-color: #008cff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
}


</style>

</head>


<body>


<header>

<h1>🐧 Penguin Profile 🐧</h1>

<p id="welcome">
Welcome Penguin!
</p>

</header>




<div class="profile">


<h2>⭐ Player Information</h2>

<p>
🐧 Username:
<b id="playerName"></b>
</p>


<p>
🏆 Rank:
Player
</p>


<p>
🪙 Coins:
10
</p>


<p>
🏠 Igloo:
Starter Igloo
</p>



<h2>🏅 Achievements</h2>


<div class="badges">

<p>🎮 Joined The Paper Game</p>

<p>🐧 First Login Completed</p>

</div>


<center>

<a href="index.html">

<button>
⬅ Back to CP Legacy
</button>

</a>

</center>





<script>


let params = new URLSearchParams(window.location.search);

let player = params.get("player");


if(player){

document.getElementById("playerName").innerHTML = player;

document.getElementById("welcome").innerHTML =
"🎉 Welcome " + player + "!! 🐧";

}

else{

document.getElementById("playerName").innerHTML =
"Guest";

}


</script>



</body>

</html>
