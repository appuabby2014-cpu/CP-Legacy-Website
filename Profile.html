<!DOCTYPE html>
<html>

<head>

<title>Penguin Profile - CP Legacy</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #dff6ff;
    margin: 0;
}


header {
    background-color: #008cff;
    color: white;
    text-align: center;
    padding: 30px;
}


.profile {
    background: white;
    margin: 20px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 3px 10px gray;
}


.badges {
    background-color: gold;
    padding: 15px;
    border-radius: 10px;
}


button {
    background-color: #008cff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
}


</style>

</head>


<body>


<header>

<h1>🐧 Penguin Profile 🐧</h1>

<p id="welcome">
Welcome Penguin!
</p>

</header>




<div class="profile">


<h2>⭐ Player Information</h2>

<p>
🐧 Username:
<b id="playerName"></b>
</p>


<p>
🏆 Rank:
Player
</p>


<p>
🪙 Coins:
10
</p>


<p>
🏠 Igloo:
Starter Igloo
</p>



<h2>🏅 Achievements</h2>


<div class="badges">

<p>🎮 Joined The Paper Game</p>

<p>🐧 First Login Completed</p>

</div>


<center>

<a href="index.html">

<button>
⬅ Back to CP Legacy
</button>

</a>

</center>





<script>


let params = new URLSearchParams(window.location.search);

let player = params.get("player");


let playerData = {

"Fiery_Fortnite_Crusher": {
coins: 0,
badge: "No badges yet",
events: "No events won",
igloo: "Starter Igloo"
},

"Abby": {
coins: 50,
badge: "👑 Founder Badge",
events: "No events won",
igloo: "King Castle Igloo"
},

"Appu": {
coins: 100000000000,
badge: "👑 Founder Badge + Game Master",
events: "Creator Events",
igloo: "Legendary Igloo"
},

"Azad": {
coins: 0,
badge: "No badges yet",
events: "No events won",
igloo: "Starter Igloo"
},

"Arnav": {
coins: 0,
badge: "No badges yet",
events: "No events won",
igloo: "Starter Igloo"
},

"Ceyone": {
coins: 0,
badge: "No badges yet",
events: "No events won",
igloo: "Starter Igloo"
}

};


if(player && playerData[player]){

document.getElementById("playerName").innerHTML = player;

document.getElementById("welcome").innerHTML =
"🎉 Welcome " + player + "!! 🐧";


document.querySelector(".profile").innerHTML +=

"<h2>🪙 Player Stats</h2>" +
"<p>🪙 Coins: " + playerData[player].coins + "</p>" +
"<p>🏅 Badge: " + playerData[player].badge + "</p>" +
"<p>🎉 Events: " + playerData[player].events + "</p>" +
"<p>🏠 Igloo: " + playerData[player].igloo + "</p>";

}

else{

document.getElementById("playerName").innerHTML =
"Guest";

}

</script>



</body>

</html>
