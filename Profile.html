<!DOCTYPE html>
<html>

<head>

<title>Penguin Profile - CP Legacy</title>

<style>

body {
    font-family: Arial, sans-serif;
    background-color: #dff6ff;
    margin: 0;
}


header {
    background-color: #008cff;
    color: white;
    text-align: center;
    padding: 30px;
}


.profile {
    background: white;
    margin: 20px;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0px 3px 10px gray;
}


.badges {
    background-color: gold;
    padding: 15px;
    border-radius: 10px;
}


button {
    background-color: #008cff;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 10px;
}


</style>

</head>


<body>


<header>

<h1>🐧 Penguin Profile 🐧</h1>

<p id="welcome">
Welcome Penguin!
</p>

</header>




<div class="profile">


<h2>⭐ Player Information</h2>

<p>
🐧 Username:
<b id="playerName"></b>
</p>


<p>
🏆 Rank:
Player
</p>







<h2>🏅 Achievements</h2>


<div class="badges">

<p>🎮 Joined The Paper Game</p>

<p>🐧 First Login Completed</p>

</div>



<script>


let params = new URLSearchParams(window.location.search);

let player = params.get("player");



let coins = JSON.parse(localStorage.getItem("coins")) || {

"Fiery_Fortnite_Crusher":0,

"Abby":50,

"Appu":100000000000,

"Ceyone":10,

"Azad":10,

"Arnav":25,

};



let playerData = {


"Fiery_Fortnite_Crusher": {

badge: "No badges yet",

events: "No events won",

igloo: "Starter Igloo"

},


"Abby": {

badge: "👑 Founder Badge",

events: "No events won",

igloo: "King Castle Igloo"

},


"Appu": {

badge: "👑 Founder Badge + Game Master",

events: "Creator Events",

igloo: "Legendary Igloo"

},


"Azad": {

badge: "No badges yet",

events: "No events won",

igloo: "Starter Igloo"

},


"Arnav": {

badge: "No badges yet",

events: "No events won",

igloo: "Starter Igloo"

},


"Ceyone": {

badge: "No badges yet",

events: "No events won",

igloo: "Starter Igloo"

}


};



if(player && playerData[player]){


document.getElementById("playerName").innerHTML = player;


document.getElementById("welcome").innerHTML =
"🎉 Welcome " + player + "!! 🐧";



document.querySelector(".profile").innerHTML +=

"<h2>🪙 Player Stats</h2>" +

"<p>🪙 Coins: " + coins[player] + "</p>" +

"<p>🏅 Badge: " + playerData[player].badge + "</p>" +

"<p>🎉 Events: " + playerData[player].events + "</p>" +

"<p>🏠 Igloo: " + playerData[player].igloo + "</p>";

}


else{


document.getElementById("playerName").innerHTML =
"Guest";

}



</script>



</body>

</html>
