<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Snowball Arena</title>

<style>

body{
margin:0;
background:#7fd3ff;
overflow:hidden;
font-family:Arial;
}


#arena{

position:relative;
width:100vw;
height:100vh;
background:#dff7ff;
border:10px solid #008cff;
box-sizing:border-box;
overflow:hidden;

}



#hud{

position:absolute;
top:10px;
left:10px;
background:white;
padding:15px;
border-radius:15px;
font-weight:bold;
z-index:10;

}



.player{

position:absolute;
width:50px;
height:50px;
font-size:40px;
user-select:none;

}



.healthBar{

position:absolute;
top:-12px;
left:0;
width:50px;
height:7px;
background:red;
border-radius:5px;

}



.health{

height:100%;
width:100%;
background:limegreen;
border-radius:5px;

}



.name{

position:absolute;
top:55px;
left:-25px;
width:100px;
text-align:center;
font-size:14px;
font-weight:bold;

}


</style>

</head>


<body>


<div id="arena">


<div id="hud">

❄️ Snowball Dodgeball Arena
<br>
WASD = Move

</div>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


const SUPABASE_URL =
"https://yhccnaljtfiwdwwrdtcm.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PU7x7B2L7mXBmbTaFWJ-hQ_2wD3MXMU";



const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



let currentPlayer =
new URLSearchParams(window.location.search)
.get("player");



let roomID = "lobby1";



if(!currentPlayer){

currentPlayer="Unknown";

}



let x = 200;

let y = 200;



let health = 100;



let players = {};



let keys = {};

// =============================
// PLAYER MOVEMENT
// =============================


document.addEventListener("keydown", e=>{

keys[e.key.toLowerCase()] = true;

});


document.addEventListener("keyup", e=>{

keys[e.key.toLowerCase()] = false;

});




// =============================
// CREATE / UPDATE OUR PLAYER
// =============================


async function updateMyPlayer(){


const {data,error}=await supabaseClient
.from("snowball_game")
.upsert({

room_id: roomID,
username: currentPlayer,
health: health,
alive: true,
x: Math.floor(x),
y: Math.floor(y)

},
{
onConflict:"room_id,username"
});


if(error){

console.log("UPDATE ERROR:",error);

}


}




// =============================
// LOAD ALL PLAYERS
// =============================


async function loadPlayers(){


const {data,error}=await supabaseClient
.from("snowball_game")
.select("*")
.eq("room_id",roomID);



if(error){

console.log("LOAD PLAYERS ERROR:",error);
return;

}



players={};



data.forEach(player=>{


players[player.username]=player;



});



drawPlayers();


}





// =============================
// DRAW PENGUINS
// =============================


function drawPlayers(){


document.querySelectorAll(".player")
.forEach(e=>e.remove());



Object.values(players).forEach(player=>{



let div=document.createElement("div");


div.className="player";


div.style.left=player.x+"px";

div.style.top=player.y+"px";



div.innerHTML=`

<div class="healthBar">

<div class="health"

style="width:${player.health}%">

</div>

</div>


🐧


<div class="name">

${player.username}

</div>

`;



document.getElementById("arena")
.appendChild(div);



});



}





// =============================
// GAME LOOP
// =============================


function gameLoop(){


if(keys["w"])
y-=4;


if(keys["s"])
y+=4;


if(keys["a"])
x-=4;


if(keys["d"])
x+=4;



// borders


if(x<0)
x=0;


if(y<0)
y=0;


if(x>window.innerWidth-60)
x=window.innerWidth-60;


if(y>window.innerHeight-60)
y=window.innerHeight-60;







requestAnimationFrame(gameLoop);


}




gameLoop();



// refresh other players

setInterval(loadPlayers,500);

// =============================
// INITIAL JOIN
// =============================


async function startArena(){


console.log("Joining arena as:", currentPlayer);



await updateMyPlayer();



await loadPlayers();



}



startArena();




// =============================
// AUTO UPDATE POSITION
// =============================


setInterval(()=>{

updateMyPlayer();

},200);




// =============================
// AUTO REFRESH PLAYERS
// =============================


setInterval(()=>{

loadPlayers();

},500);



</script>


</body>

</html>
